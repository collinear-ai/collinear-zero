name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash -n collinearzero/scripts/opencode-continue.sh install.sh
      - run: python scripts/lint.py
      - run: python -m unittest discover -s tests -t .
      - run: pip install . && cz --version && cz render --harness claude > /dev/null
      - name: install.sh piped into bash, as with curl
        run: CZ_SOURCE="$PWD" bash -s -- claude < install.sh && grep -q collinearzero:begin ~/.claude/CLAUDE.md
