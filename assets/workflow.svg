<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0352D"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E7A4C"/>
    </marker>
  </defs>

  <rect width="880" height="600" fill="#FFFFFF"/>

  <!-- Row 1 -->
  <rect x="40" y="40" width="300" height="60" rx="8" fill="#EEF2FC" stroke="#2B4EBD" stroke-width="1.5"/>
  <text x="190" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#17202C">Agent patches</text>
  <text x="190" y="86" text-anchor="middle" font-size="12.5" fill="#4B5563">rules + security-patch skill</text>

  <line x1="340" y1="70" x2="398" y2="70" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="400" y="40" width="200" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="500" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#17202C">Checkpoint</text>
  <text x="500" y="86" text-anchor="middle" font-size="12.5" fill="#4B5563">harness snapshots the tree</text>

  <line x1="500" y1="100" x2="500" y2="168" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="40" y="170" width="560" height="60" rx="8" fill="#FBF1DF" stroke="#9C630E" stroke-width="1.5"/>
  <text x="320" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#17202C">Attack-tester</text>
  <text x="320" y="216" text-anchor="middle" font-size="12.5" fill="#4B5563">fresh session · gets the task and the pre-patch snapshot; diffs the patch itself</text>

  <line x1="150" y1="230" x2="150" y2="328" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="166" y="268" font-size="12.5" font-weight="600" fill="#17202C">structured findings</text>
  <text x="166" y="288" font-size="12.5" fill="#4B5563">
    <tspan font-family="'IBM Plex Mono', Menlo, Consolas, monospace" fill="#B0352D">[B]</tspan> bypass ·
    <tspan font-family="'IBM Plex Mono', Menlo, Consolas, monospace" fill="#9C630E">[R]</tspan> regression + backing path · not run
  </text>

  <!-- Row 3 -->
  <rect x="40" y="330" width="220" height="60" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="150" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#17202C">Deterministic triage</text>
  <text x="150" y="376" text-anchor="middle" font-size="12.5" fill="#4B5563">no model; filters findings</text>

  <line x1="260" y1="360" x2="318" y2="360" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="320" y="330" width="240" height="60" rx="8" fill="#EEF2FC" stroke="#2B4EBD" stroke-width="1.5"/>
  <text x="440" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#17202C">One fix round</text>
  <text x="440" y="376" text-anchor="middle" font-size="12.5" fill="#4B5563">in the agent's session</text>

  <line x1="560" y1="360" x2="618" y2="360" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="330" width="220" height="60" rx="8" fill="#FBF1DF" stroke="#9C630E" stroke-width="1.5"/>
  <text x="730" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#17202C">Recheck</text>
  <text x="730" y="376" text-anchor="middle" font-size="12.5" fill="#4B5563">re-run legitimate-use checks</text>

  <!-- Outcomes -->
  <path d="M700 390 V430 H490 V468" fill="none" stroke="#B0352D" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="595" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#B0352D" letter-spacing="0.06em">BROKEN</text>

  <line x1="770" y1="390" x2="770" y2="468" stroke="#1E7A4C" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="782" y="434" font-size="12" font-weight="700" fill="#1E7A4C" letter-spacing="0.06em">PASS</text>

  <rect x="380" y="470" width="220" height="60" rx="8" fill="#FBECEB" stroke="#B0352D" stroke-width="1.5"/>
  <text x="490" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#17202C">Revert to checkpoint</text>
  <text x="490" y="516" text-anchor="middle" font-size="12.5" fill="#4B5563">undo the fix round</text>

  <rect x="660" y="470" width="180" height="60" rx="8" fill="#E8F4EE" stroke="#1E7A4C" stroke-width="1.5"/>
  <text x="750" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#17202C">Keep the fix</text>
  <text x="750" y="516" text-anchor="middle" font-size="12.5" fill="#4B5563">final patch</text>

  <!-- Legend -->
  <g font-size="12" fill="#4B5563">
    <rect x="40" y="562" width="16" height="12" rx="2" fill="#EEF2FC" stroke="#2B4EBD"/>
    <text x="62" y="572">main agent</text>
    <rect x="150" y="562" width="16" height="12" rx="2" fill="#FBF1DF" stroke="#9C630E"/>
    <text x="172" y="572">attack-tester</text>
    <rect x="270" y="562" width="16" height="12" rx="2" fill="#F3F4F6" stroke="#6B7280"/>
    <text x="292" y="572">harness (no model)</text>
  </g>
</svg>
